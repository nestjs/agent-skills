name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node.js line in "engines" and the current ones.
        node-version: ['20.19', 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate skills (frontmatter, links, versions)
        run: npm run validate
      - name: Test the installer
        run: npm test
      - name: Check the package contents
        run: npm pack --dry-run

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate the Claude Code plugin and marketplace
        run: npx -y @anthropic-ai/claude-code@2 plugin validate --strict .
