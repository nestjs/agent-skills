name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate skills and versions
        run: npm run validate
      # Gemini CLI installs an extension from the latest release's archive, with
      # gemini-extension.json at the archive root, so the archive is plugins/nestjs.
      - name: Build the extension archive
        run: tar -czf nestjs.tar.gz -C plugins/nestjs .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nestjs.tar.gz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
